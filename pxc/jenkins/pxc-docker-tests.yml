- job:
    name: pxc-docker-tests-fix
    project-type: pipeline
    description: |
        Do not edit this job through the web!
    properties:
        - build-discarder:
            num-to-keep: 15
    concurrent: true
    pipeline-scm:
        scm:
            - git:
                url: https://github.com/grishma123-eng/jenkins-pipelines.git
                branches:
                    - 'fix-test-job'
                wipe-workspace: true
        lightweight-checkout: true
        script-path: pxc/jenkins/pxc-docker-tests.groovy
